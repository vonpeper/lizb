services:
  lizbernal-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lizbernal-app
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lizbernal.rule=Host(`lizbernal.mx`) || Host(`www.lizbernal.mx`)"
      - "traefik.http.routers.lizbernal.entrypoints=websecure"
      - "traefik.http.routers.lizbernal.tls.certresolver=letsencrypt"
      - "traefik.http.services.lizbernal.loadbalancer.server.port=3000"
      - "traefik.docker.network=dokploy-network"
    networks:
      - default
      - dokploy-network

networks:
  dokploy-network:
    external: true
